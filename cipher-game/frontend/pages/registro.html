<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CIPHER — Registro</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/tema.css"/>
  <script src="../js/tema.js"></script>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icono">⬡</div>
      <div class="auth-logo-titulo">CIPHER</div>
      <div class="auth-logo-sub">Crear cuenta de agente</div>
    </div>

    <div class="auth-divider"></div>

    <form id="form-registro" novalidate>
      <div style="display:flex;flex-direction:column;gap:14px">

        <div class="form-group">
          <label class="form-label" for="nombre">Nombre completo</label>
          <input class="form-input" type="text" id="nombre"
            placeholder="Tu nombre completo" required/>
        </div>

        <div class="form-group">
          <label class="form-label" for="correo">Correo</label>
          <input class="form-input" type="email" id="correo"
            placeholder="correo@ejemplo.com" required/>
        </div>

        <div class="form-group">
          <label class="form-label" for="grado">Grado escolar</label>
          <select class="form-input" id="grado" required>
            <option value="" disabled selected>Selecciona tu grado</option>
            <option value="6°">6°</option>
            <option value="7°">7°</option>
            <option value="8°">8°</option>
            <option value="9°">9°</option>
            <option value="10°">10°</option>
            <option value="11°">11°</option>
            <option value="Universidad">Universidad</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-input" type="password" id="password"
            placeholder="Mínimo 6 caracteres" required/>
        </div>

        <div class="form-group">
          <label class="form-label" for="password2">Confirmar contraseña</label>
          <input class="form-input" type="password" id="password2"
            placeholder="Repite tu contraseña" required/>
        </div>

        <div id="msg-registro" class="msg oculto"></div>

        <button type="submit" class="btn btn-primary" id="btn-registro">
          Crear cuenta
        </button>

      </div>
    </form>

    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </div>

  </div>
</div>

<script src="../js/filtro-nombres.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  // Aviso inmediato al terminar de escribir el nombre
  document.getElementById('nombre').addEventListener('blur', (e) => {
    const valor = e.target.value.trim();
    if (!valor) return;
    const revision = FiltroNombres.validarNombre(valor);
    e.target.classList.toggle('error', !revision.valido);
    const msg = document.getElementById('msg-registro');
    if (!revision.valido) {
      msg.textContent = revision.error;
      msg.className   = 'msg msg-error';
    } else {
      msg.className = 'msg oculto';
    }
  });

  document.getElementById('form-registro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn  = document.getElementById('btn-registro');
    const msg  = document.getElementById('msg-registro');
    msg.className = 'msg oculto';

    const nombre   = document.getElementById('nombre').value.trim();
    const correo   = document.getElementById('correo').value.trim();
    const grado    = document.getElementById('grado').value;
    const password = document.getElementById('password').value;
    const password2= document.getElementById('password2').value;

    if (!nombre || !correo || !grado || !password)
      return mostrarError('Todos los campos son obligatorios');

    const revisionNombre = FiltroNombres.validarNombre(nombre);
    if (!revisionNombre.valido)
      return mostrarError(revisionNombre.error);
    if (password.length < 6)
      return mostrarError('La contraseña debe tener al menos 6 caracteres');
    if (password !== password2)
      return mostrarError('Las contraseñas no coinciden');

    btn.disabled = true;
    btn.textContent = 'Creando cuenta...';

    try {
      const data = await API.post('/auth/registro', { nombre, correo, grado, password });
      Auth.guardarSesion(data.token, data.usuario);
      // Siempre va al pre-test tras registrarse
      window.location.href = 'pretest.html';
    } catch (err) {
      mostrarError(err.message || 'Error al crear la cuenta');
      btn.disabled = false;
      btn.textContent = 'Crear cuenta';
    }

    function mostrarError(texto) {
      msg.textContent = texto;
      msg.className   = 'msg msg-error';
    }
  });
</script>
</body>
</html>
