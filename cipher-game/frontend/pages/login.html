<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CIPHER — Iniciar sesión</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/tema.css"/>
  <script src="../js/tema.js"></script>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icono">⬡</div>
      <div class="auth-logo-titulo">CIPHER</div>
      <div class="auth-logo-sub">Sistema de recuperación de datos</div>
    </div>

    <div class="auth-divider"></div>

    <form id="form-login" novalidate>
      <div style="display:flex;flex-direction:column;gap:16px">

        <div class="form-group">
          <label class="form-label" for="correo">Correo institucional</label>
          <input
            class="form-input" type="email" id="correo"
            placeholder="estudiante@correo.com" autocomplete="email" required/>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            class="form-input" type="password" id="password"
            placeholder="••••••••" autocomplete="current-password" required/>
        </div>

        <div id="msg-login" class="msg oculto"></div>

        <button type="submit" class="btn btn-primary" id="btn-login">
          Acceder al sistema
        </button>

      </div>
    </form>

    <div class="auth-footer">
      ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
    </div>

  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const msg = document.getElementById('msg-login');
    btn.disabled = true;
    btn.textContent = 'Verificando...';
    msg.className = 'msg oculto';

    const correo   = document.getElementById('correo').value.trim();
    const password = document.getElementById('password').value;

    try {
      const data = await API.post('/auth/login', { correo, password });
      Auth.guardarSesion(data.token, data.usuario);

      // Redirigir según rol
      if (data.usuario.rol === 'admin') {
        window.location.href = 'admin.html';
      } else {
        // Verificar si ya completó el pre-test
        const { completado } = await API.get('/pretest/mio');
        window.location.href = completado ? '../index.html' : 'pretest.html';
      }
    } catch (err) {
      msg.textContent  = err.message || 'Correo o contraseña incorrectos';
      msg.className    = 'msg msg-error';
      btn.disabled     = false;
      btn.textContent  = 'Acceder al sistema';
    }
  });
</script>
</body>
</html>
